[package]
name = "omgbot"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["cargo", "derive", "env"] }
rand = "0.10.3"
serenity = { version = "0.12.5", features = ["voice"] }
songbird = { version = "0.6.1" }
symphonia = { version = "0.5.5", features = ["mp3"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
